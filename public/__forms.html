<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Netlify Forms Blueprints</title><meta name="robots" content="noindex"></head><body>
<!-- Static detection blueprints for Netlify Forms; do not link to this file. -->
<form name="becoming-session-01" method="POST" data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="becoming-session-01">
  <input type="hidden" name="session"><input type="hidden" name="registration_status">
  <input name="bot-field"><input name="first_name"><input name="email"><input name="motivation">
  <input name="series_interest"><textarea name="note"></textarea>
  <input name="event_contact_consent"><input name="marketing_opt_in">
</form>
<form name="becoming-sessions-waitlist" method="POST" data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="becoming-sessions-waitlist">
  <input type="hidden" name="source"><input name="bot-field">
  <input name="first_name"><input name="email"><input name="contact_consent">
</form>
</body></html>
