<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Netlify Forms Registration Blueprint</title><meta name="robots" content="noindex"></head><body>
<!-- Static blueprint for Netlify Forms; actual form is on /community/becoming-sessions. Do not link this file. -->
<form name="becoming-session-01" method="POST" data-netlify="true" netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="becoming-session-01">
  <input type="hidden" name="session">
  <input type="hidden" name="registration_status">
  <input name="bot-field">
  <input name="first_name"><input name="email"><input name="motivation">
  <input name="series_interest"><textarea name="note"></textarea>
  <input name="event_contact_consent"><input name="marketing_opt_in">
</form>
</body></html>
