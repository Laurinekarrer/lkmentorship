<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Form detection</title></head><body>
<!-- Netlify parses this static HTML during deployment, enabling the form rendered by Next.js. -->
<form name="becoming-club-interest" method="POST" data-netlify="true" data-netlify-honeypot="bot-field">
  <input type="hidden" name="form-name" value="becoming-club-interest">
  <p><label>Don't fill this out: <input name="bot-field"></label></p>
  <input type="text" name="first_name">
  <input type="email" name="email">
  <select name="interest"><option value="Coffee & Connection">Coffee & Connection</option><option value="Becoming Sessions">Becoming Sessions</option><option value="Both">Both</option></select>
  <select name="hope"><option value="New friendships">New friendships</option><option value="Meaningful conversation">Meaningful conversation</option><option value="Self-discovery">Self-discovery</option><option value="Discover Amsterdam">Discover Amsterdam</option></select>
  <input type="checkbox" name="contact_consent" value="yes">
</form></body></html>
